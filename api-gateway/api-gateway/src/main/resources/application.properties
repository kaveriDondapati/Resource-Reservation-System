spring.application.name=api-gateway
server.port=8080

auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}
resource.service.url=${RESOURCE_SERVICE_URL:http://localhost:8082}
reservation.service.url=${RESERVATION_SERVICE_URL:http://localhost:8083}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

springdoc.api-docs.path=/v3/api-docs/gateway
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urlsPrimaryName=Auth
springdoc.swagger-ui.urls[0].name=Auth
springdoc.swagger-ui.urls[0].url=/v3/api-docs/auth
springdoc.swagger-ui.urls[1].name=Resources
springdoc.swagger-ui.urls[1].url=/v3/api-docs/resources
springdoc.swagger-ui.urls[2].name=Reservations
springdoc.swagger-ui.urls[2].url=/v3/api-docs/reservations
