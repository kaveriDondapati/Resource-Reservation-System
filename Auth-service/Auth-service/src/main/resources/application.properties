spring.application.name=auth-service
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:dev-only-change-me-please-use-32-plus-characters}
jwt.expiration=${JWT_EXPIRATION:3600000}

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

springdoc.api-docs.path=/v3/api-docs/auth
openapi.server-url=${OPENAPI_SERVER_URL:http://localhost:8080}
