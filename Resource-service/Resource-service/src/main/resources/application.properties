spring.application.name=resource-service
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resource_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:dev-only-change-me-please-use-32-plus-characters}
app.seed-resources=${SEED_RESOURCES:true}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

springdoc.api-docs.path=/v3/api-docs/resources
openapi.server-url=${OPENAPI_SERVER_URL:http://localhost:8080}
