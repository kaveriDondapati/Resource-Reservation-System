spring.application.name=reservation-service
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservation_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:dev-only-change-me-please-use-32-plus-characters}
resource.service.url=${RESOURCE_SERVICE_URL:http://localhost:8082}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

springdoc.api-docs.path=/v3/api-docs/reservations
openapi.server-url=${OPENAPI_SERVER_URL:http://localhost:8080}

spring.cloud.openfeign.client.config.resource-service.connect-timeout=3000
spring.cloud.openfeign.client.config.resource-service.read-timeout=3000
